name: desafio_nps_fase_1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Análise de dados e estatística
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy
  - scikit-learn
  - statsmodels
  # Visualização
  - matplotlib=3.10.9
  - seaborn=0.13.2
  # Testes
  - pytest=9.1.1
  # Qualidade de código (mesmas versões do .pre-commit-config.yaml)
  - black=23.9.1
  - isort=5.12.0
  - flake8=6.1.0
  - pre-commit=4.5.0